services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.fpm
    container_name: symfony_backend_fpm
    expose:
      - "9000"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    depends_on:
      - database

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: symfony_nginx
    ports:
      - "8001:80"
    depends_on:
      - backend

  database:
    image: mysql:8.0
    container_name: symfony_mysql_fpm
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: assurance_pro
    ports:
      - "3308:3306"